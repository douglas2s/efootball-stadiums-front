<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Catálogo completo de estádios licenciados e genéricos do eFootball, com busca, filtros por país e tema claro/escuro."
    />
    <title>eFootball Stadiums — Catálogo de Estádios</title>

    <!-- Google Fonts: Barlow Condensed (títulos esportivos) + Plus Jakarta Sans (leitura UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Aplica o tema salvo antes do React carregar para evitar "piscada" de cor (FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem('efootball-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
